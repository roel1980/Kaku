}

    const wrong=result.mistakes;
    const message=p===100?'Alles goed geschreven!':p>=80?'Heel goed gedaan!':p>=60?'Je bent goed op weg.':'Mooi geoefend. Blijf herhalen.';
    return `<div class="result-hero"><div class="eyebrow" style="justify-content:center">${esc(result.level)} · ${esc(TYPES.find(x=>x.id===result.type)?.label)}</div><div style="margin:20px auto 0;width:50px;height:50px;color:#b77b38">${ico('trophy').replace('<svg','<svg style="width:50px;height:50px"')}</div><h1 class="page-title">${message}</h1><div class="result-circle">${p}%</div><div class="result-caption">${result.correct} van de ${result.total} antwoorden goed</div></div>
      <div class="result-grid"><div class="panel result-stat"><strong>${result.correct}</strong><span>Goed</span></div><div class="panel result-stat"><strong>${wrong.length}</strong><span>Nog oefenen</span></div><div class="panel result-stat"><strong>${result.masteredNew}</strong><span>Nieuw beheerst</span></div></div>
      <div class="result-actions">${wrong.length?`<button class="button primary" data-action="review-missed">Herhaal mijn fouten ${ico('reset')}</button>`:''}<button class="button outline" data-action="new-quiz">Nieuwe oefening ${ico('arrow')}</button><button class="button outline" data-nav="dashboard">Terug naar overzicht</button></div>
      ${wrong.length?`<section class="mistakes panel"><div style="padding:21px 20px 7px"><h2 class="section-title">Deze items verdienen extra aandacht</h2><div class="section-sub">Ze krijgen voorrang bij volgende oefeningen.</div></div><div class="table-wrap"><table><thead><tr><th>Betekenis</th><th>Juiste antwoord</th><th>Jouw invoer</th></tr></thead><tbody>${wrong.map(x=>{const item=getItem(x.id);return `<tr><td>${esc(item?.[result.language]||'')}</td><td class="jp" lang="ja">${esc(item?.ja||'')}</td><td lang="ja">${esc(x.skipped?'Overgeslagen':x.text)}</td></tr>`;}).join('')}</tbody></table></div></section>`:''}`;
  }
  function filterCatalog() {
    const q=catalog.query.trim().toLowerCase();
    return inventory(db.settings.level).filter(item=>{
      if(catalog.type!=='all'&&item.type!==catalog.type)return false;
      if(catalog.status!=='all'&&getStatus(getP(item.id))!==catalog.status)return false;
      if(q&&!([item.ja,item.reading,item.nl,item.en].some(v=>String(v||'').toLowerCase().includes(q))))return false;
      return true;
    });
  }
  function catalogTable() {
    const filtered=filterCatalog();
    const rows=filtered.slice(0,catalog.limit);
    const table=rows.length?`<div class="table-wrap"><table class="catalog-table"><thead><tr><th>Betekenis</th><th>Japans</th><th>Beheersing</th><th>Score</th></tr></thead><tbody>${rows.map(item=>{const p=getP(item.id);return `<tr data-detail="${esc(item.id)}" tabindex="0" role="button" aria-label="Bekijk ${esc(byLang(item))}"><td><span class="meaning">${esc(byLang(item))}</span></td><td><span class="ja" lang="ja">${esc(item.ja)}</span><span class="reading" lang="ja">${esc(item.reading)}</span></td><td>${statusChip(p)}</td><td style="color:var(--muted);white-space:nowrap">${p.attempts?`${p.correct}/${p.attempts}`:'—'}</td></tr>`;}).join('')}</tbody></table></div>`:`<div class="empty">Geen items gevonden met deze filters.</div>`;
    return table+`<div class="loadmore-wrap"><span class="catalog-count">${rows.length} van ${filtered.length} items</span>${rows.length<filtered.length?`<div style="margin-top:12px"><button data-action="load-more" class="button outline mini">Toon meer ${ico('arrow')}</button></div>`:''}</div>`;
  }
  function renderLibrary() {
    const all=inventory(db.settings.level);
    const counts=TYPES.map(t=>`${t.label}: ${all.filter(x=>x.type===t.id).length}`).join(' · ');
    const typeFilters=[['all','Alles'],...TYPES.map(t=>[t.id,t.label])];
    const statusFilters=[['all','Alle statussen'],['new','Nieuw'],['learning','Oefenen'],['almost','Bijna beheerst'],['mastered','Beheerst']];
    return header('Jouw woordenlijst',`${counts}. Tik op een item voor je persoonlijke leergeschiedenis.`, 'Alle oefenstof')+
      `<div class="section-head"><div class="level-row">${levelChoices()}</div><div class="switch-row">${langChoices()}</div></div>
      <div class="catalog-toolbar"><div class="catalog-filters">${typeFilters.map(([value,label])=>`<button type="button" class="filter-pill ${catalog.type===value?'active':''}" data-filter="type" data-value="${value}">${label}</button>`).join('')}</div><div class="catalog-control"><select id="status-select" class="search-input" aria-label="Filter op beheersing" style="min-width:157px">${statusFilters.map(([value,label])=>`<option value="${value}" ${catalog.status===value?'selected':''}>${label}</option>`).join('')}</select><input id="catalog-search" type="search" class="search-input" aria-label="Zoek in woordenlijst" placeholder="Zoek betekenis of Japans..." value="${esc(catalog.query)}"></div></div>
      <section class="panel" id="catalog-results">${catalogTable()}</section><div class="notice">N5 bevat de <strong>84</strong> en N4 de <strong>169 aanvullende Kanji</strong> uit de OpenJLPT-indeling. De woorden zijn geselecteerd op de gebruikte Kanji en de zinnen zijn samengesteld. Er bestaat geen officiële actuele volledige JLPT-lijst. Andere correcte vertalingen zijn mogelijk, vooral bij zinnen.</div>`;
  }
  function renderSettings() {
    return header('Instellingen en back-up','Je gegevens blijven op dit apparaat. Een account is niet nodig.', 'Jouw gegevens')+`
      <div class="settings-layout"><section class="panel settings-panel"><div class="small-eyebrow">Gegevens veilig bewaren</div><h2 style="margin-top:10px">Back-up van je voortgang</h2><p>Je oefenresultaten, herhalingsmomenten en instellingen worden lokaal in de browser bewaard. Exporteer af en toe een back-upbestand, vooral voordat je browsergegevens wist of de app opnieuw installeert.</p>
      <div class="settings-actions"><button class="button dark" data-action="export">${ico('download')} Exporteer back-up</button><button class="button outline" data-action="import">${ico('upload')} Importeer back-up</button><input type="file" id="backup-file" accept="application/json,.json" class="offscreen" aria-label="Back-upbestand kiezen"></div><div class="settings-footnote">Een import vervangt de bestaande voortgang. Het JSON-bestand bevat geen wachtwoorden of accountgegevens.</div></section>
      <section class="panel settings-panel"><div class="small-eyebrow">Offline leren</div><h2 style="margin-top:10px">Zonder abonnement of cloud</h2><p>De oefenstof, slimme herhaling en beoordeling draaien op je eigen apparaat. De Japanse handschriftinvoer is onderdeel van iPadOS, niet van deze app.</p>
      <div class="notice"><strong>Zo gebruik je hem als offline app:</strong> zet de bestanden gratis op een HTTPS-website, open die op je iPad en kies in het deelmenu ‘Zet op beginscherm’. Na de eerste succesvolle installatie kan de app zonder internet worden geopend.</div>
      <div class="settings-footnote">Ook staand en liggend bruikbaar · Geen externe fonts · Geen trackers · Geen online AI-beoordeling.</div></section>
      <section class="panel settings-panel"><div class="small-eyebrow">Inhoud</div><h2 style="margin-top:10px">Oefenstof</h2><p>Deze versie bevat <strong>${DATA.length} items</strong>, verspreid over vijf JLPT-niveaus: <strong>${DATA.filter(x=>x.type==='kanji').length} Kanji</strong>, <strong>${DATA.filter(x=>x.type==='words').length} woorden</strong> en <strong>${DATA.filter(x=>x.type==='sentences').length} zinnen</strong>.</p><p>De zinnen hebben een vooraf vastgelegd modelantwoord. Bij andere correcte formuleringen kun je zelf <em>Dit is ook correct</em> kiezen. Japanse Kanji worden als tekst gecontroleerd, niet op streepvolgorde.</p><div class="settings-footnote">N5/N4: <a href="https://github.com/evanclan/OpenJLPT" rel="noopener noreferrer" target="_blank">OpenJLPT</a> (kanjilijst; CC BY-SA 4.0). Nederlandse betekenissen, geselecteerde woorden en oefenzinnen zijn voor Kaku bewerkt en aangevuld. Niveaus zijn benaderingen; het officiële JLPT publiceert geen actuele complete vocabulairelijsten. Versie 1.1.</div></section>
      <section class="panel settings-panel"><div class="small-eyebrow">Opnieuw beginnen</div><h2 style="margin-top:10px">Voortgang wissen</h2><p>Wil je opnieuw beginnen? Dit wist alleen de opgeslagen scores en instellingen, niet de oefenstof. Exporteer eerst een back-up als je de voortgang later wilt terugzetten.</p><div class="settings-actions"><button class="button danger" data-action="clear-progress">${ico('reset')} Wis mijn voortgang</button></div></section></div>`;
  }
  function relatedExamples(item) {
    if (!['kanji','words'].includes(item.type) || !['N5','N4'].includes(item.level)) return '';
    const levels=item.level==='N5'?['N5']:['N5','N4'];
    const candidates=DATA.filter(x=>levels.includes(x.level));
    const wordCandidates=item.type==='kanji' ? candidates.filter(x=>x.type==='words'&&x.ja.includes(item.ja)).slice(0,8) : [];
    const sentenceCandidates=candidates.filter(x=>x.type==='sentences'&&x.ja.includes(item.ja)).slice(0,4);
    const renderExamples=(heading,arr)=>arr.length?`<div style="margin-top:20px"><div class="small-eyebrow" style="margin-bottom:9px">${heading}</div>${arr.map(x=>`<div class="activity-row" style="padding:8px 0"><div><div class="activity-main" lang="ja">${esc(x.ja)}</div><div class="activity-sub">${esc(x.reading)}</div></div><span class="activity-sub" style="max-width:40%;text-align:right">${esc(byLang(x))}</span></div>`).join('')}</div>`:'';
    return renderExamples('Woorden met deze Kanji',wordCandidates)+renderExamples('Voorbeeldzinnen',sentenceCandidates);
  }
  function showDetail(id) {
    const item=getItem(id); if(!item)return;
    const p=getP(item.id);const dialog=document.querySelector('#detail-dialog');
    document.querySelector('#detail-dialog-content').innerHTML=`<div class="dialog-inner"><div class="dialog-top"><div><span class="small-eyebrow">${esc(item.level)} · ${esc(TYPES.find(t=>t.id===item.type)?.label)}</span></div><button type="button" class="icon-btn" data-action="close-dialog" aria-label="Sluiten">${ico('close')}</button></div>
      <div class="dialog-jp" lang="ja">${esc(item.ja)}</div><div class="dialog-reading" lang="ja">${esc(item.reading)}</div><div class="dialog-meaning">${esc(byLang(item))}</div>${statusChip(p)}
      <div class="dialog-stats"><div><b>${p.attempts}</b><span>Keer geoefend</span></div><div><b>${p.correct}</b><span>Goed</span></div><div><b>${p.streak}</b><span>Goed op rij</span></div></div>${relatedExamples(item)}<div class="settings-footnote">${p.attempts?`Laatst geoefend: ${dateFor(p.last)} · Opnieuw oefenen: ${dateFor(p.due)}`:'Nog niet eerder geoefend.'}</div>
      <div style="margin-top:25px;display:flex;justify-content:flex-end"><button class="button outline mini" data-action="close-dialog">Sluiten</button></div></div>`;
    dialog.showModal();
  }
  function setView(v) {
    if(quiz && v!== 'quiz' && !confirm('Oefening stoppen? De nog niet afgeronde oefening wordt niet opgeslagen.'))return;
    quiz=null;result=null;view=v;render();window.scrollTo?.(0,0);
  }
  function render() {
    // Opnieuw bepalen na elke vraag: feedback mag niet in de compacte modus blijven.
    document.body.classList.remove('writing-mode');
    document.querySelector('main')?.style.removeProperty('--writing-push');
    const main=document.querySelector('#main');
    main.innerHTML=({ dashboard:renderDashboard, practice:renderPractice, library:renderLibrary, settings:renderSettings, quiz:renderQuiz, result:renderResult }[view] || renderDashboard)();
    document.querySelector('#breadcrumb').textContent=({dashboard:'Mijn overzicht',practice:'Nieuwe oefening',library:'Woordenlijst',settings:'Instellingen',quiz:'Aan het oefenen',result:'Oefening afgerond'})[view]||'Kaku';
    document.querySelectorAll('[data-nav]').forEach(btn=>btn.classList.toggle('is-active',btn.dataset.nav===view));
    if(view==='quiz' && !quiz.pending) document.querySelector('#answer-input')?.focus({preventScroll:true});
    syncWritingMode();
    updateConnection();
  }
  function updateConnection() {
    const el=document.querySelector('#connection-status');
    const local=location.protocol==='file:';
    el.innerHTML=`<span class="connection-dot"></span>${!storageAvailable?'Opslag mogelijk niet beschikbaar':local?'Lokale HTML-modus':navigator.serviceWorker?.controller?'Offline geïnstalleerd':'Offline PWA beschikbaar'}`;
  }
  function downloadBackup() {
    const backup={app:'Kaku',exportedAt:new Date().toISOString(),version:1,settings:db.settings,progress:db.progress,customAnswers:db.customAnswers,sessions:db.sessions};
    const file=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(file);
    const a=document.createElement('a');a.href=url;a.download=`kaku-backup-${dayKey()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
    showToast('Back-upbestand aangemaakt. Bewaar het in Bestanden.');
  }
  function importBackup(file) {
    if(!file)return;
    if(file.size>8_000_000){showToast('Dit back-upbestand is te groot.');return;}
    file.text().then(text=>{
      let data;
      try{data=JSON.parse(text);}catch(e){throw new Error('Geen geldig JSON-bestand.');}
      if(data.app!=='Kaku'||data.version!==1||!data.progress||typeof data.progress!=='object'||!Array.isArray(data.sessions))throw new Error('Dit is geen geldige Kaku-back-up.');
      if(!confirm('Je huidige voortgang vervangen door deze back-up?'))return;
      const progress={};const ids=new Set(DATA.map(x=>x.id));
      for(const [id,p] of Object.entries(data.progress)) {
        if (!ids.has(id)||!p||typeof p!=='object')continue;
        const attempts=Number(p.attempts), correct=Number(p.correct), streak=Number(p.streak);
        if(![attempts,correct,streak].every(Number.isInteger)||attempts<0||correct<0||correct>attempts||streak<0||streak>attempts)continue;
        progress[id]={attempts,correct,streak,days:Array.isArray(p.days)?p.days.filter(x=>/^\d{4}-\d\d-\d\d$/.test(x)).slice(-12):[],last:p.last||null,due:p.due||null,lastCorrect:!!p.lastCorrect};
      }
      const incoming=data.settings||{};
      db.settings={
        language:['nl','en'].includes(incoming.language)?incoming.language:'nl',
        level:LEVELS.includes(incoming.level)?incoming.level:'N4',
        type:TYPES.some(x=>x.id===incoming.type)?incoming.type:'words',
        count:[5,10,25,50].includes(Number(incoming.count))?Number(incoming.count):10
      };
      db.progress=progress;
      db.customAnswers={};
      if (data.customAnswers && typeof data.customAnswers==='object') {
        for(const [id,answers] of Object.entries(data.customAnswers)) {
          if(ids.has(id)&&Array.isArray(answers)) db.customAnswers[id]=answers.filter(x=>typeof x==='string'&&x.length<200).slice(-20);
        }
      }
      db.sessions=data.sessions.filter(x=>LEVELS.includes(x.level)&&Number.isInteger(x.total)&&Number.isInteger(x.correct)&&x.total>=1&&x.correct<=x.total&&x.correct>=0).slice(-200);
      save();render();showToast('Je voortgang is hersteld.');
    }).catch(e=>showToast(e.message||'Kon back-up niet openen.'));
  }

  // Apple Pencil schrijft via het gewone iPadOS-toetsenbord.
  // Het handschriftpaneel is van iPadOS zelf en kan niet vanuit de pagina worden verkleind.
  // Maak daarom het zichtbare quizgedeelte compact en schuif het in beeld.
  const touchKeyboardDevice = (navigator.maxTouchPoints || 0) > 0 ||
    (window.matchMedia && matchMedia('(pointer:coarse)').matches);
  let writingScrollToken=0;
  function scrollWritingIntoView() {
    if (!document.body.classList.contains('writing-mode')) return;
    const main=document.querySelector('main');
    const prompt=document.querySelector('.question-word');
    const answer=document.querySelector('.answer-panel');
    const input=document.querySelector('#answer-input');
    if (!main || !prompt || !answer || !input) return;
    const vv=window.visualViewport;
    const visibleTop=vv ? vv.offsetTop : 0;
    const visibleBottom=visibleTop+(vv ? vv.height : window.innerHeight);
    const screenHeight=window.screen?.height||window.innerHeight;
    const keyboardOcclusion=Math.max(window.innerHeight,screenHeight)-visibleBottom;
    // Verplaats alleen naar het schrijfblok als het scherm werkelijk is verkleind.
    // Zonder schermtoetsenbord (Magic Keyboard) blijft de gebruikelijke layout staan.
    const keyboardVisible=keyboardOcclusion>120;
    const oldPush=parseFloat(main.style.getPropertyValue('--writing-push'))||0;
    const answerRect=answer.getBoundingClientRect();
    const promptRect=prompt.getBoundingClientRect();
    if (!keyboardVisible) {
      if(oldPush) main.style.setProperty('--writing-push','0px');
      return;
    }
    // Dock de complete quiz vlak boven iPadOS-handschrift, met 15px ruimte.
    // Rekening houden met de bestaande verschuiving voorkomt oscillaties bij resize.
    const targetBottom=visibleBottom-15;
    const delta=targetBottom-answerRect.bottom;
    const newPush=Math.max(0,Math.min(360,oldPush+delta));
    if(Math.abs(oldPush-newPush)>2) main.style.setProperty('--writing-push',Math.round(newPush)+'px');
    // Past alles niet in het zichtbare deel, dan gaat het invoerveld voor.
    const nextInput=input.getBoundingClientRect();
    const nextPrompt=prompt.getBoundingClientRect();
    const nextAnswer=answer.getBoundingClientRect();
    let scrollDelta=0;
    if(nextAnswer.bottom>visibleBottom-9) scrollDelta=nextAnswer.bottom-visibleBottom+9;
    else if(nextPrompt.top<visibleTop+7 && nextInput.bottom-nextPrompt.top<visibleBottom-visibleTop-14)
      scrollDelta=nextPrompt.top-visibleTop-7;
    if(Math.abs(scrollDelta)>3) window.scrollBy(0,scrollDelta);
  }
  function scheduleWritingScroll() {
    const token=++writingScrollToken;
    requestAnimationFrame(()=>{
      if(token===writingScrollToken) scrollWritingIntoView();
    });
    // Op iPadOS animeert het handschriftpaneel; meet tijdens én na de animatie.
    for(const ms of [90,230,450,680]) setTimeout(()=>{
      if(token===writingScrollToken) scrollWritingIntoView();
    },ms);
  }
  function syncWritingMode() {
    const input=document.querySelector('#answer-input');
    const active=!!(touchKeyboardDevice && view==='quiz' && quiz && !quiz.pending &&
      input && document.activeElement===input);
    document.body.classList.toggle('writing-mode',active);
    if(active) scheduleWritingScroll();
    else {
      ++writingScrollToken;
      document.querySelector('main')?.style.removeProperty('--writing-push');
    }
  }
  document.addEventListener('focusin',e=>{
    if(e.target?.id==='answer-input') syncWritingMode();
  });
  document.addEventListener('focusout',e=>{
    if(e.target?.id==='answer-input') {
      // Wacht op de klik op Controleren/Overslaan; geen verspringende knop tijdens tikken.
      setTimeout(()=>{
        if(document.activeElement?.id!=='answer-input' && view==='quiz') {
          document.body.classList.remove('writing-mode');
          ++writingScrollToken;
        }
      },340);
    }
  });
  if(window.visualViewport) {
    window.visualViewport.addEventListener('resize',()=>{
      if(document.body.classList.contains('writing-mode')) scheduleWritingScroll();
    });
    window.visualViewport.addEventListener('scroll',()=>{
      if(document.body.classList.contains('writing-mode')) scheduleWritingScroll();
    });
  }
  window.addEventListener('orientationchange',()=>{
    if(document.body.classList.contains('writing-mode')) scheduleWritingScroll();
  });

  document.addEventListener('click',e=>{
    const nav=e.target.closest('[data-nav]');if(nav){setView(nav.dataset.nav);return;}
    const setting=e.target.closest('[data-setting]');if(setting){setSetting(setting.dataset.setting,setting.dataset.value);return;}
    const filter=e.target.closest('[data-filter]');if(filter){catalog[filter.dataset.filter]=filter.dataset.value;catalog.limit=60;render();return;}
    const detail=e.target.closest('[data-detail]');if(detail){showDetail(detail.dataset.detail);return;}
    const action=e.target.closest('[data-action]');if(!action)return;
    switch(action.dataset.action){
      case 'start': startQuiz();break;
      case 'check': check();break;
      case 'skip': skip();break;
      case 'next': next();break;
      case 'override': overrideCorrect();break;
      case 'quit': setView('practice');break;
      case 'review-missed': {const pool=[...new Map(result.mistakes.map(r=>[r.id,getItem(r.id)])).values()].filter(Boolean);startQuiz(pool);break;}
      case 'new-quiz': setView('practice');break;
      case 'load-more': catalog.limit+=60;document.querySelector('#catalog-results').innerHTML=catalogTable();break;
      case 'close-dialog': document.querySelector('#detail-dialog').close();break;
      case 'export': downloadBackup();break;
      case 'import': document.querySelector('#backup-file')?.click();break;
      case 'clear-progress': if(confirm('Alle leerresultaten en oefengeschiedenis definitief wissen?')){db=structuredClone(defaultData);save();render();showToast('Je voortgang is gewist.');}break;
    }
  });
  document.addEventListener('input',e=>{
    if(e.target.id==='catalog-search'&&!e.isComposing){catalog.query=e.target.value;catalog.limit=60;document.querySelector('#catalog-results').innerHTML=catalogTable();}
  });
  document.addEventListener('change',e=>{
    if(e.target.id==='status-select'){catalog.status=e.target.value;catalog.limit=60;document.querySelector('#catalog-results').innerHTML=catalogTable();}
    if(e.target.id==='backup-file'){importBackup(e.target.files?.[0]);e.target.value='';}
  });
  let answerIsComposing=false;
  let answerCompositionEndedAt=0;
  document.addEventListener('compositionstart',e=>{
    if(e.target?.id==='answer-input') answerIsComposing=true;
  });
  document.addEventListener('compositionend',e=>{
    if(e.target?.id==='answer-input') {
      answerIsComposing=false;
      answerCompositionEndedAt=Date.now();
    }
  });
  function safeKeyboardSubmit() {
    // Bevestiging van een Japanse IME-kandidaat mag niet al de quiz insturen.
    if(answerIsComposing || Date.now()-answerCompositionEndedAt<100) return;
    if(quiz?.pending) next(); else check();
  }
  document.addEventListener('submit',e=>{
    if(e.target?.id==='answer-form') {
      e.preventDefault();
      if(view==='quiz' && quiz) safeKeyboardSubmit();
    }
  });
  document.addEventListener('keydown',e=>{
    if(e.target.matches?.('[data-detail]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();showDetail(e.target.dataset.detail);return;}
    if(view!=='quiz'||!quiz)return;
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){
      // Enter van iPadOS, Apple Pencil of Magic Keyboard: één keer insturen.
      if(e.target.id==='answer-input'||(quiz.pending&&e.target.tagName!=='BUTTON')){
        e.preventDefault();safeKeyboardSubmit();
      }
    }
  });
  document.querySelector('#detail-dialog').addEventListener('click',e=>{
    if(e.target.id==='detail-dialog')e.target.close();
  });
  document.querySelector('#today-label').textContent=new Intl.DateTimeFormat('nl-NL',{weekday:'long',day:'numeric',month:'long'}).format(new Date());
  document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=ico(el.dataset.icon));
  if('serviceWorker' in navigator&&['http:','https:'].includes(location.protocol)){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(updateConnection).catch(()=>{}));
    navigator.serviceWorker.addEventListener('controllerchange',updateConnection);
  }
  render();
})();

</script>
</body>
</html>
