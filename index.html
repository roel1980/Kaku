      <div class="settings-actions"><button class="button dark" data-action="export">${ico('download')} Exporteer back-up</button><button class="button outline" data-action="import">${ico('upload')} Importeer back-up</button><input type="file" id="backup-file" accept="application/json,.json" class="offscreen" aria-label="Back-upbestand kiezen"></div><div class="settings-footnote">Een import vervangt de bestaande voortgang. Het JSON-bestand bevat geen wachtwoorden of accountgegevens.</div></section>
      <section class="panel settings-panel"><div class="small-eyebrow">Offline leren</div><h2 style="margin-top:10px">Zonder abonnement of cloud</h2><p>De oefenstof, slimme herhaling en beoordeling draaien op je eigen apparaat. De Japanse handschriftinvoer is onderdeel van iPadOS, niet van deze app.</p>
      <div class="notice"><strong>Zo gebruik je hem als offline app:</strong> zet de bestanden gratis op een HTTPS-website, open die op je iPad en kies in het deelmenu ‘Zet op beginscherm’. Na de eerste succesvolle installatie kan de app zonder internet worden geopend.</div>
      <div class="settings-footnote">Ook staand en liggend bruikbaar · Geen externe fonts · Geen trackers · Geen online AI-beoordeling.</div></section>
      <section class="panel settings-panel"><div class="small-eyebrow">Inhoud</div><h2 style="margin-top:10px">Oefenstof</h2><p>Deze versie bevat <strong>${DATA.length} items</strong>, verspreid over vijf JLPT-niveaus: <strong>${DATA.filter(x=>x.type==='kanji').length} Kanji</strong>, <strong>${DATA.filter(x=>x.type==='words').length} woorden</strong> en <strong>${DATA.filter(x=>x.type==='sentences').length} zinnen</strong>.</p><p>De zinnen hebben een vooraf vastgelegd modelantwoord. Bij andere correcte formuleringen kun je zelf <em>Dit is ook correct</em> kiezen. Japanse Kanji worden als tekst gecontroleerd, niet op streepvolgorde.</p><div class="settings-footnote">Niveaus zijn bij benadering ingedeeld; het officiële JLPT publiceert geen actuele complete vocabulairelijsten.</div></section>
      <section class="panel settings-panel"><div class="small-eyebrow">Opnieuw beginnen</div><h2 style="margin-top:10px">Voortgang wissen</h2><p>Wil je opnieuw beginnen? Dit wist alleen de opgeslagen scores en instellingen, niet de oefenstof. Exporteer eerst een back-up als je de voortgang later wilt terugzetten.</p><div class="settings-actions"><button class="button danger" data-action="clear-progress">${ico('reset')} Wis mijn voortgang</button></div></section></div>`;
  }
  function showDetail(id) {
    const item=getItem(id); if(!item)return;
    const p=getP(item.id);const dialog=document.querySelector('#detail-dialog');
    document.querySelector('#detail-dialog-content').innerHTML=`<div class="dialog-inner"><div class="dialog-top"><div><span class="small-eyebrow">${esc(item.level)} · ${esc(TYPES.find(t=>t.id===item.type)?.label)}</span></div><button type="button" class="icon-btn" data-action="close-dialog" aria-label="Sluiten">${ico('close')}</button></div>
      <div class="dialog-jp" lang="ja">${esc(item.ja)}</div><div class="dialog-reading" lang="ja">${esc(item.reading)}</div><div class="dialog-meaning">${esc(byLang(item))}</div>${statusChip(p)}
      <div class="dialog-stats"><div><b>${p.attempts}</b><span>Keer geoefend</span></div><div><b>${p.correct}</b><span>Goed</span></div><div><b>${p.streak}</b><span>Goed op rij</span></div></div><div class="settings-footnote">${p.attempts?`Laatst geoefend: ${dateFor(p.last)} · Opnieuw oefenen: ${dateFor(p.due)}`:'Nog niet eerder geoefend.'}</div>
      <div style="margin-top:25px;display:flex;justify-content:flex-end"><button class="button outline mini" data-action="close-dialog">Sluiten</button></div></div>`;
    dialog.showModal();
  }
  function setView(v) {
    if(quiz && v!== 'quiz' && !confirm('Oefening stoppen? De nog niet afgeronde oefening wordt niet opgeslagen.'))return;
    quiz=null;result=null;view=v;render();window.scrollTo?.(0,0);
  }
  function render() {
    const main=document.querySelector('#main');
    main.innerHTML=({ dashboard:renderDashboard, practice:renderPractice, library:renderLibrary, settings:renderSettings, quiz:renderQuiz, result:renderResult }[view] || renderDashboard)();
    document.querySelector('#breadcrumb').textContent=({dashboard:'Mijn overzicht',practice:'Nieuwe oefening',library:'Woordenlijst',settings:'Instellingen',quiz:'Aan het oefenen',result:'Oefening afgerond'})[view]||'Kaku';
    document.querySelectorAll('[data-nav]').forEach(btn=>btn.classList.toggle('is-active',btn.dataset.nav===view));
    if(view==='quiz' && !quiz.pending) document.querySelector('#answer-input')?.focus({preventScroll:true});
    updateConnection();
  }
  function updateConnection() {
    const el=document.querySelector('#connection-status');
    const local=location.protocol==='file:';
    el.innerHTML=`<span class="connection-dot"></span>${!storageAvailable?'Opslag mogelijk niet beschikbaar':local?'Lokale HTML-modus':navigator.serviceWorker?.controller?'Offline geïnstalleerd':'Offline PWA beschikbaar'}`;
  }
  function downloadBackup() {
    const backup={app:'Kaku',exportedAt:new Date().toISOString(),version:1,settings:db.settings,progress:db.progress,customAnswers:db.customAnswers,sessions:db.sessions};
    const file=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(file);
    const a=document.createElement('a');a.href=url;a.download=`kaku-backup-${dayKey()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
    showToast('Back-upbestand aangemaakt. Bewaar het in Bestanden.');
  }
  function importBackup(file) {
    if(!file)return;
    if(file.size>8_000_000){showToast('Dit back-upbestand is te groot.');return;}
    file.text().then(text=>{
      let data;
      try{data=JSON.parse(text);}catch(e){throw new Error('Geen geldig JSON-bestand.');}
      if(data.app!=='Kaku'||data.version!==1||!data.progress||typeof data.progress!=='object'||!Array.isArray(data.sessions))throw new Error('Dit is geen geldige Kaku-back-up.');
      if(!confirm('Je huidige voortgang vervangen door deze back-up?'))return;
      const progress={};const ids=new Set(DATA.map(x=>x.id));
      for(const [id,p] of Object.entries(data.progress)) {
        if (!ids.has(id)||!p||typeof p!=='object')continue;
        const attempts=Number(p.attempts), correct=Number(p.correct), streak=Number(p.streak);
        if(![attempts,correct,streak].every(Number.isInteger)||attempts<0||correct<0||correct>attempts||streak<0||streak>attempts)continue;
        progress[id]={attempts,correct,streak,days:Array.isArray(p.days)?p.days.filter(x=>/^\d{4}-\d\d-\d\d$/.test(x)).slice(-12):[],last:p.last||null,due:p.due||null,lastCorrect:!!p.lastCorrect};
      }
      const incoming=data.settings||{};
      db.settings={
        language:['nl','en'].includes(incoming.language)?incoming.language:'nl',
        level:LEVELS.includes(incoming.level)?incoming.level:'N4',
        type:TYPES.some(x=>x.id===incoming.type)?incoming.type:'words',
        count:[5,10,25,50].includes(Number(incoming.count))?Number(incoming.count):10
      };
      db.progress=progress;
      db.customAnswers={};
      if (data.customAnswers && typeof data.customAnswers==='object') {
        for(const [id,answers] of Object.entries(data.customAnswers)) {
          if(ids.has(id)&&Array.isArray(answers)) db.customAnswers[id]=answers.filter(x=>typeof x==='string'&&x.length<200).slice(-20);
        }
      }
      db.sessions=data.sessions.filter(x=>LEVELS.includes(x.level)&&Number.isInteger(x.total)&&Number.isInteger(x.correct)&&x.total>=1&&x.correct<=x.total&&x.correct>=0).slice(-200);
      save();render();showToast('Je voortgang is hersteld.');
    }).catch(e=>showToast(e.message||'Kon back-up niet openen.'));
  }
  document.addEventListener('click',e=>{
    const nav=e.target.closest('[data-nav]');if(nav){setView(nav.dataset.nav);return;}
    const setting=e.target.closest('[data-setting]');if(setting){setSetting(setting.dataset.setting,setting.dataset.value);return;}
    const filter=e.target.closest('[data-filter]');if(filter){catalog[filter.dataset.filter]=filter.dataset.value;catalog.limit=60;render();return;}
    const detail=e.target.closest('[data-detail]');if(detail){showDetail(detail.dataset.detail);return;}
    const action=e.target.closest('[data-action]');if(!action)return;
    switch(action.dataset.action){
      case 'start': startQuiz();break;
      case 'check': check();break;
      case 'skip': skip();break;
      case 'next': next();break;
      case 'override': overrideCorrect();break;
      case 'quit': setView('practice');break;
      case 'review-missed': {const pool=[...new Map(result.mistakes.map(r=>[r.id,getItem(r.id)])).values()].filter(Boolean);startQuiz(pool);break;}
      case 'new-quiz': setView('practice');break;
      case 'load-more': catalog.limit+=60;document.querySelector('#catalog-results').innerHTML=catalogTable();break;
      case 'close-dialog': document.querySelector('#detail-dialog').close();break;
      case 'export': downloadBackup();break;
      case 'import': document.querySelector('#backup-file')?.click();break;
      case 'clear-progress': if(confirm('Alle leerresultaten en oefengeschiedenis definitief wissen?')){db=structuredClone(defaultData);save();render();showToast('Je voortgang is gewist.');}break;
    }
  });
  document.addEventListener('input',e=>{
    if(e.target.id==='catalog-search'&&!e.isComposing){catalog.query=e.target.value;catalog.limit=60;document.querySelector('#catalog-results').innerHTML=catalogTable();}
  });
  document.addEventListener('change',e=>{
    if(e.target.id==='status-select'){catalog.status=e.target.value;catalog.limit=60;document.querySelector('#catalog-results').innerHTML=catalogTable();}
    if(e.target.id==='backup-file'){importBackup(e.target.files?.[0]);e.target.value='';}
  });
  document.addEventListener('keydown',e=>{
    if(e.target.matches?.('[data-detail]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();showDetail(e.target.dataset.detail);return;}
    if(view!=='quiz'||!quiz)return;
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){
      // Niet reageren terwijl iPadOS Japanse kandidaten bevestigt.
      if(e.target.id==='answer-input'||(quiz.pending&&e.target.tagName!=='BUTTON')){e.preventDefault();if(quiz.pending)next();else check();}
    }
  });
  document.querySelector('#detail-dialog').addEventListener('click',e=>{
    if(e.target.id==='detail-dialog')e.target.close();
  });
  document.querySelector('#today-label').textContent=new Intl.DateTimeFormat('nl-NL',{weekday:'long',day:'numeric',month:'long'}).format(new Date());
  document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=ico(el.dataset.icon));
  if('serviceWorker' in navigator&&['http:','https:'].includes(location.protocol)){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(updateConnection).catch(()=>{}));
    navigator.serviceWorker.addEventListener('controllerchange',updateConnection);
  }
  render();
})();

</script>
</body>
</html>
